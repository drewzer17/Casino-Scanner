<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Buildout Universe — 181 Tickers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f13;
      --surface:   #18181f;
      --border:    #2a2a35;
      --text:      #e2e2e8;
      --muted:     #8888a0;
      --accent:    #a855f7;
      --accent-dk: #7e22ce;
      --green:     #22c55e;
      --red:       #e0525e;
      --yellow:    #fbbf24;
      --row-hover: #1e1e28;
      /* pill colors matching scanner */
      --pill-active-bg:     #ffcc33;
      --pill-active-border: #ffcc33;
      --pill-active-text:   #111;
      /* subcategory pill colors — teal accent */
      --subpill-active-bg:     #0891b2;
      --subpill-active-border: #0891b2;
      --subpill-active-text:   #fff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .back-btn:hover { background: var(--accent-dk); color: #fff; }
    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .ticker-count-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      background: #2e1065;
      border: 1px solid var(--accent);
      border-radius: 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }

    /* ── Search bar ──────────────────────────────── */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      flex: 1;
      min-width: 220px;
      max-width: 400px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); }
    .result-count {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Pill filter section ─────────────────────── */
    .pill-section {
      padding: 10px 28px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pill-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .pill-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
      margin-right: 2px;
      padding-top: 5px; /* align with pill text */
      flex-shrink: 0;
    }

    .pill-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    /* Matches scanner .filter-toggle-btn exactly */
    .pill-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      padding: 3px 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.1s;
      line-height: 1.4;
    }
    .pill-btn:hover {
      border-color: var(--muted);
      color: var(--text);
    }
    .pill-btn.active {
      background: var(--pill-active-bg);
      border-color: var(--pill-active-border);
      color: var(--pill-active-text);
    }

    /* Matches scanner .filter-count exactly */
    .pill-count {
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      min-width: 18px;
      text-align: center;
      line-height: 1.4;
    }
    .pill-btn.active .pill-count {
      background: rgba(0,0,0,0.15);
    }

    /* ── Category pill collapse animation ───────── */
    /* Direct "All" pill needs a right margin when gap is 0 */
    #cat-pill-all { margin-right: 4px; }

    /* Container uses margin instead of gap so 0-width wrappers leave no ghost space */
    #cat-pills { gap: 0; }

    /* Wrapper around each non-All category pill */
    .cat-pill-wrap {
      display: inline-flex;
      overflow: hidden;
      max-width: 350px;
      margin-right: 4px;
      transition: max-width 0.18s ease, opacity 0.18s ease, margin-right 0.18s ease;
    }
    .cat-pill-wrap.collapsed {
      max-width: 0;
      opacity: 0;
      pointer-events: none;
      margin-right: 0;
    }

    /* ── Subcategory pills — smaller + teal accent ── */
    .pill-btn.sub-pill {
      padding: 2px 7px;
      font-size: 11px;
    }
    .pill-btn.sub-pill.active {
      background: var(--subpill-active-bg);
      border-color: var(--subpill-active-border);
      color: var(--subpill-active-text);
    }
    .pill-btn.sub-pill .pill-count {
      font-size: 9px;
      padding: 0 4px;
      min-width: 14px;
    }
    /* Subcategory label — slightly smaller to match the sub-pills */
    .pill-label.sub-label {
      font-size: 9px;
      padding-top: 4px;
    }

    /* ── Table ───────────────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      padding: 0 28px 40px;
      margin-top: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    thead tr { border-bottom: 2px solid var(--border); }
    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
      transition: color 0.15s;
    }
    th.th-nodot { cursor: default; }
    th:not(.th-nodot):hover { color: var(--text); }
    th .sort-icon {
      display: inline-block;
      margin-left: 4px;
      opacity: 0.35;
      font-size: 10px;
    }
    th.sorted .sort-icon { opacity: 1; color: var(--accent); }
    th.sorted { color: var(--accent); }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      cursor: pointer;
    }
    tbody tr:hover { background: var(--row-hover); }
    td { padding: 10px 14px; font-size: 13px; }

    .td-num     { color: var(--muted); font-size: 12px; width: 40px; }
    .td-dot     { width: 48px; text-align: center; }
    .td-ticker  {
      font-weight: 700;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      color: var(--accent);
      letter-spacing: 0.02em;
      width: 80px;
    }
    .td-company  { color: var(--text); }
    .td-category { color: var(--text); }
    .td-subcat   { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .td-price    { color: var(--text); font-family: "Courier New", Courier, monospace; white-space: nowrap; }
    .td-at-add   { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .td-date     { display: block; font-size: 10px; color: var(--muted); opacity: 0.7; margin-top: 1px; }
    .td-chg.pos  { color: var(--green); font-weight: 600; }
    .td-chg.neg  { color: var(--red);   font-weight: 600; }
    .td-chg.neu  { color: var(--muted); }

    /* Research dot */
    .rdot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      vertical-align: middle;
    }
    .rdot-green  { background: var(--green);  box-shadow: 0 0 4px rgba(34,197,94,0.5); }
    .rdot-yellow { background: var(--yellow); box-shadow: 0 0 4px rgba(251,191,36,0.5); }
    .rdot-gray   { background: #6b7280; }

    /* Source badges */
    .source-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .source-badge.combined   { background: #1e3a5f; color: #60a5fa; border: 1px solid #3b82f6; }
    .source-badge.complete   { background: #14532d; color: #4ade80; border: 1px solid #22c55e; }
    .source-badge.supplement { background: #4a1d96; color: #c084fc; border: 1px solid #a855f7; }

    /* ── State / error ───────────────────────────── */
    .state-row td {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      font-size: 14px;
    }
    .error-banner {
      margin: 20px 28px;
      padding: 14px 18px;
      background: #3b0000;
      border: 1px solid #ef4444;
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
      display: none;
    }
    .error-banner.visible { display: block; }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="page-header-left">
      <a class="back-btn" href="/">← Back to Scanner</a>
      <h1 class="page-title">AI Buildout Universe</h1>
      <span class="ticker-count-badge" id="badge">181 Tickers</span>
    </div>
  </div>

  <!-- ── Search bar ────────────────────────────────── -->
  <div class="search-bar">
    <input id="search" class="search-input" type="text"
      placeholder="Filter by ticker or company…" autocomplete="off" spellcheck="false" />
    <span class="result-count" id="result-count"></span>
  </div>

  <!-- ── Pill filters ──────────────────────────────── -->
  <div class="pill-section">
    <!-- Category row: always visible -->
    <div class="pill-row">
      <span class="pill-label">Category</span>
      <div class="pill-group" id="cat-pills"></div>
    </div>
    <!-- Subcategory row: shown only when a category is active -->
    <div class="pill-row" id="subcat-row" style="display:none">
      <span class="pill-label sub-label">Subcategory</span>
      <div class="pill-group" id="subcat-pills"></div>
    </div>
  </div>

  <div class="error-banner" id="error-banner"></div>

  <div class="table-wrap">
    <table id="ticker-table">
      <thead>
        <tr>
          <th class="td-num th-nodot">#</th>
          <th class="td-dot th-nodot">Research</th>
          <th data-col="ticker" class="sorted">Ticker <span class="sort-icon">↑</span></th>
          <th data-col="company_name">Company <span class="sort-icon">↕</span></th>
          <th data-col="source">Source <span class="sort-icon">↕</span></th>
          <th data-col="category">Category <span class="sort-icon">↕</span></th>
          <th data-col="current_price">Price <span class="sort-icon">↕</span></th>
          <th data-col="price_at_add">At Add <span class="sort-icon">↕</span></th>
          <th data-col="change_pct">Change % <span class="sort-icon">↕</span></th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr class="state-row"><td colspan="9">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // ── State ────────────────────────────────────────────────────────────────
    let allTickers   = [];
    let sortCol      = "ticker";
    let sortDir      = 1;
    let filterText   = "";
    let filterCat    = "";
    let filterSubcat = "";

    const TOTAL = 181;

    // ── Load data ────────────────────────────────────────────────────────────
    async function loadTickers() {
      try {
        const res = await fetch("/api/ai-overview/tickers");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        allTickers = data.tickers || data;
        buildCategoryPills();
        render();
      } catch (err) {
        const banner = document.getElementById("error-banner");
        banner.textContent = "Failed to load tickers: " + err.message;
        banner.classList.add("visible");
        document.getElementById("table-body").innerHTML =
          '<tr class="state-row"><td colspan="9">Error loading data.</td></tr>';
      }
    }

    // ── Category counts (static — based on full dataset) ────────────────────
    function catCounts() {
      const m = {};
      allTickers.forEach(t => {
        const c = t.category || "";
        if (c) m[c] = (m[c] || 0) + 1;
      });
      return m;
    }

    function subcatCounts(cat) {
      const m = {};
      allTickers
        .filter(t => t.category === cat)
        .forEach(t => {
          const s = t.subcategory || "";
          if (s) m[s] = (m[s] || 0) + 1;
        });
      return m;
    }

    // ── Build category pills (once after data loads) ─────────────────────────
    function buildCategoryPills() {
      const counts = catCounts();
      // Sort categories: "01.", "02.", ..., "18.", "99." last
      const cats = Object.keys(counts).sort((a, b) => {
        const na = parseInt(a) || 999;
        const nb = parseInt(b) || 999;
        return na - nb;
      });

      const container = document.getElementById("cat-pills");
      container.innerHTML = "";

      // "All" pill — placed directly (not wrapped) so it's always visible
      const allBtn = makePill("All", allTickers.length, true, () => {
        filterCat = "";
        filterSubcat = "";
        refreshCatPills();
        refreshSubcatRow();
        render();
      });
      allBtn.id = "cat-pill-all";
      container.appendChild(allBtn);

      cats.forEach(cat => {
        const btn = makePill(cat, counts[cat], false, () => {
          if (filterCat === cat) {
            // Toggle off → back to All
            filterCat = "";
            filterSubcat = "";
            refreshCatPills();
            refreshSubcatRow();
          } else {
            filterCat = cat;
            filterSubcat = "";
            refreshCatPills();
            refreshSubcatRow();
          }
          render();
        });
        btn.dataset.cat = cat;

        // Wrap in a collapsible wrapper so inactive pills can animate out
        const wrap = document.createElement("span");
        wrap.className = "cat-pill-wrap";
        wrap.dataset.cat = cat;
        wrap.appendChild(btn);
        container.appendChild(wrap);
      });
    }

    function refreshCatPills() {
      // "All" pill active state
      const allBtn = document.getElementById("cat-pill-all");
      if (allBtn) allBtn.classList.toggle("active", filterCat === "");

      // Each wrapped category pill: active state + collapse/expand
      document.querySelectorAll("#cat-pills .cat-pill-wrap").forEach(wrap => {
        const cat = wrap.dataset.cat;
        const isActive = cat === filterCat;

        // Active state on the button inside
        const btn = wrap.querySelector(".pill-btn");
        if (btn) btn.classList.toggle("active", isActive);

        // Collapse all non-active pills when a category is selected;
        // expand all when returning to "All"
        if (filterCat === "") {
          wrap.classList.remove("collapsed");
        } else {
          wrap.classList.toggle("collapsed", !isActive);
        }
      });
    }

    // ── Build / refresh subcategory pill row ─────────────────────────────────
    function refreshSubcatRow() {
      const row = document.getElementById("subcat-row");
      if (!filterCat) {
        row.style.display = "none";
        return;
      }
      row.style.display = "";

      const counts = subcatCounts(filterCat);
      const subcats = Object.keys(counts).sort();
      const container = document.getElementById("subcat-pills");
      container.innerHTML = "";

      // "All" subcategory pill
      const allBtn = makePill("All", Object.values(counts).reduce((a, b) => a + b, 0), true, () => {
        filterSubcat = "";
        refreshSubcatPills();
        render();
      }, true /* isSubcat */);
      allBtn.id = "subcat-pill-all";
      container.appendChild(allBtn);

      subcats.forEach(sub => {
        const btn = makePill(sub, counts[sub], false, () => {
          if (filterSubcat === sub) {
            filterSubcat = "";
          } else {
            filterSubcat = sub;
          }
          refreshSubcatPills();
          render();
        }, true /* isSubcat */);
        btn.dataset.sub = sub;
        container.appendChild(btn);
      });

      refreshSubcatPills();
    }

    function refreshSubcatPills() {
      document.querySelectorAll("#subcat-pills .pill-btn").forEach(btn => {
        const isAll = btn.id === "subcat-pill-all";
        const active = isAll ? filterSubcat === "" : btn.dataset.sub === filterSubcat;
        btn.classList.toggle("active", active);
      });
    }

    // ── Pill factory ─────────────────────────────────────────────────────────
    function makePill(label, count, isActive, onClick, isSubcat) {
      const btn = document.createElement("button");
      let cls = "pill-btn";
      if (isSubcat) cls += " sub-pill";
      if (isActive)  cls += " active";
      btn.className = cls;
      btn.innerHTML =
        escHtml(label) +
        '<span class="pill-count">' + count + '</span>';
      btn.addEventListener("click", onClick);
      return btn;
    }

    // ── Filter + sort ─────────────────────────────────────────────────────────
    function sortedFiltered() {
      let rows = allTickers.map((t, i) => Object.assign({}, t, { _idx: i + 1 }));

      if (filterText) {
        const q = filterText.toLowerCase();
        rows = rows.filter(r =>
          r.ticker.toLowerCase().includes(q) ||
          (r.company_name || "").toLowerCase().includes(q)
        );
      }
      if (filterCat) {
        rows = rows.filter(r => r.category === filterCat);
      }
      if (filterSubcat) {
        rows = rows.filter(r => r.subcategory === filterSubcat);
      }

      rows.sort((a, b) => {
        const av = a[sortCol] != null ? a[sortCol] : null;
        const bv = b[sortCol] != null ? b[sortCol] : null;
        // Nulls always sort to the bottom regardless of direction
        if (av === null && bv === null) return 0;
        if (av === null) return 1;
        if (bv === null) return -1;
        if (typeof av === "number" && typeof bv === "number") return sortDir * (av - bv);
        return sortDir * String(av).localeCompare(String(bv), undefined, { numeric: true });
      });
      return rows;
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function render() {
      const rows  = sortedFiltered();
      const tbody = document.getElementById("table-body");

      const filtered = (filterText || filterCat || filterSubcat);
      document.getElementById("badge").textContent =
        filtered ? rows.length + " of " + TOTAL + " Tickers" : TOTAL + " Tickers";
      document.getElementById("result-count").textContent =
        rows.length + (filtered ? " of " + TOTAL : "") + " tickers";

      if (rows.length === 0) {
        tbody.innerHTML = '<tr class="state-row"><td colspan="9">No tickers match your filter.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map((r, i) =>
        '<tr onclick="window.location=\'/ai-overview/' + escHtml(r.ticker) + '\'">' +
          '<td class="td-num">' + (i + 1) + '</td>' +
          '<td class="td-dot">' + researchDot(r.sections_parsed) + '</td>' +
          '<td class="td-ticker">' + escHtml(r.ticker) + '</td>' +
          '<td class="td-company">' + escHtml(r.company_name || "") + '</td>' +
          '<td>' + sourceBadge(r.source) + '</td>' +
          '<td class="td-category">' + fmtCategory(r.category, r.subcategory) + '</td>' +
          '<td class="td-price">' + fmtPrice(r.current_price) + '</td>' +
          '<td class="td-at-add">' + fmtAtAdd(r.price_at_add, r.price_at_add_date) + '</td>' +
          '<td>' + fmtChangePct(r.change_pct) + '</td>' +
        '</tr>'
      ).join("");
    }

    // ── Formatters ───────────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function sourceBadge(source) {
      if (source === "Combined v2")
        return '<span class="source-badge combined">Combined v2</span>';
      if (source === "COMPLETE")
        return '<span class="source-badge complete">COMPLETE</span>';
      if (source === "Final Supplement")
        return '<span class="source-badge supplement">Final Supplement</span>';
      return '<span class="source-badge">' + escHtml(source || "") + '</span>';
    }

    function researchDot(sections_parsed) {
      if (sections_parsed == null)
        return '<span class="rdot rdot-gray" title="Sitrep not yet available"></span>';
      if (sections_parsed === 7)
        return '<span class="rdot rdot-green" title="7/7 sections"></span>';
      return '<span class="rdot rdot-yellow" title="' + sections_parsed + '/7 sections"></span>';
    }

    function fmtPrice(v) {
      if (v == null) return '<span style="color:var(--muted)">—</span>';
      return "$" + Number(v).toFixed(2);
    }

    function fmtAtAdd(price, date) {
      if (price == null) return '<span style="color:var(--muted)">—</span>';
      let dateStr = "";
      if (date) {
        const parts = date.split("-");
        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        dateStr = '<span class="td-date">' +
          d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) +
          '</span>';
      }
      return "$" + Number(price).toFixed(2) + dateStr;
    }

    function fmtChangePct(v) {
      if (v == null) return '<span class="td-chg neu">—</span>';
      const cls = v > 0 ? "pos" : v < 0 ? "neg" : "neu";
      const sign = v > 0 ? "+" : "";
      return '<span class="td-chg ' + cls + '">' + sign + Number(v).toFixed(1) + '%</span>';
    }

    function fmtCategory(cat, sub) {
      if (!cat) return '<span style="color:var(--muted)">—</span>';
      let html = escHtml(cat);
      if (sub) html += '<span class="td-subcat">' + escHtml(sub) + '</span>';
      return html;
    }

    // ── Column sort ──────────────────────────────────────────────────────────
    document.querySelectorAll("th[data-col]").forEach(th => {
      th.addEventListener("click", () => {
        const col = th.dataset.col;
        if (sortCol === col) { sortDir = -sortDir; }
        else { sortCol = col; sortDir = 1; }
        document.querySelectorAll("th[data-col]").forEach(h => {
          h.classList.remove("sorted");
          h.querySelector(".sort-icon").textContent = "↕";
        });
        th.classList.add("sorted");
        th.querySelector(".sort-icon").textContent = sortDir === 1 ? "↑" : "↓";
        render();
      });
    });

    // ── Search ───────────────────────────────────────────────────────────────
    document.getElementById("search").addEventListener("input", e => {
      filterText = e.target.value.trim();
      render();
    });

    loadTickers();
  </script>
</body>
</html>
