<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Buildout Universe — 192 Tickers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f0f13;
      --surface:   #18181f;
      --border:    #2a2a35;
      --text:      #e2e2e8;
      --muted:     #8888a0;
      --accent:    #a855f7;
      --accent-dk: #7e22ce;
      --green:     #22c55e;
      --red:       #e0525e;
      --yellow:    #fbbf24;
      --row-hover: #1e1e28;
      /* pill colors matching scanner */
      --pill-active-bg:     #ffcc33;
      --pill-active-border: #ffcc33;
      --pill-active-text:   #111;
      /* subcategory pill colors — teal accent */
      --subpill-active-bg:     #0891b2;
      --subpill-active-border: #0891b2;
      --subpill-active-text:   #fff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 16px;
      flex-wrap: wrap;
    }
    .page-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .back-btn:hover { background: var(--accent-dk); color: #fff; }
    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .ticker-count-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      background: #2e1065;
      border: 1px solid var(--accent);
      border-radius: 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
    }

    /* ── Convergence Winners Banner ─────────────── */
    #winner-banner {
      background: #1a1b1e;
      border-bottom: 1px solid rgba(168, 85, 247, 0.3);
      padding: 14px 28px;
      display: none; /* shown by JS after load */
    }
    .wb-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }
    .wb-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .wb-meta {
      font-size: 11px;
      color: #555568;
    }
    .wb-section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(168, 85, 247, 0.7);
      margin-bottom: 6px;
    }
    .wb-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .wb-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(168, 85, 247, 0.2);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: default;
      min-width: 0;
    }
    .wb-chip-ticker {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
    }
    .wb-chip-company {
      font-size: 11px;
      color: #8888a0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }
    .wb-chip-count {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      white-space: nowrap;
    }
    .wb-chip-sectors {
      font-size: 10px;
      color: #555568;
      white-space: nowrap;
    }
    .wb-divider {
      width: 1px;
      height: 14px;
      background: rgba(168, 85, 247, 0.25);
      flex-shrink: 0;
    }
    .wb-error {
      font-size: 12px;
      color: #555568;
      font-style: italic;
    }

    /* ── Chip clickable state ────────────────────── */
    .wb-chip {
      cursor: pointer;
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .wb-chip:hover {
      border-color: rgba(168, 85, 247, 0.5);
    }
    .wb-chip.wb-chip-active {
      border-color: rgba(168, 85, 247, 0.8);
      box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2);
    }

    /* ── Inline expansion ────────────────────────── */
    .wb-expansion {
      display: none;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(168, 85, 247, 0.2);
      border-radius: 6px;
      padding: 14px 16px 12px;
      margin-top: 8px;
      margin-bottom: 4px;
    }
    .wb-exp-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .wb-exp-title {
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
    }
    .wb-exp-company {
      font-size: 13px;
      color: #8888a0;
      margin-left: 6px;
      font-weight: 400;
      font-family: inherit;
    }
    .wb-exp-close {
      background: none;
      border: none;
      color: #555568;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
      line-height: 1;
      flex-shrink: 0;
    }
    .wb-exp-close:hover { color: #e55; }
    .wb-exp-meta {
      font-size: 12px;
      color: #8888a0;
      margin-bottom: 10px;
      line-height: 1.8;
    }
    .wb-exp-meta strong { color: #ccc; margin-right: 4px; }
    .wb-in-universe  { color: #22c55e; }
    .wb-not-universe { color: #6b7280; }
    .wb-exp-sectors-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(168, 85, 247, 0.7);
      margin-bottom: 8px;
    }
    .wb-sector-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }
    .wb-sector-pill {
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid rgba(168, 85, 247, 0.22);
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      color: rgba(200, 150, 255, 0.9);
      cursor: default;
      white-space: nowrap;
    }
    .wb-sector-pill .sp-count {
      color: rgba(168, 85, 247, 0.6);
      margin-left: 3px;
    }
    .wb-exp-footer {
      text-align: center;
      margin-top: 6px;
    }
    .wb-expand-btn {
      background: none;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 6px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 18px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .wb-expand-btn:hover { background: rgba(168, 85, 247, 0.1); }

    /* ── Winner modal ────────────────────────────── */
    #wb-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 9000;
      align-items: center;
      justify-content: center;
    }
    #wb-modal-overlay.wb-open { display: flex; }
    #wb-modal {
      background: #1a1b1e;
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 10px;
      width: 80vw;
      max-width: 1000px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .wb-modal-header {
      padding: 20px 24px 14px;
      border-bottom: 1px solid rgba(168, 85, 247, 0.15);
      flex-shrink: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .wb-modal-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      padding-right: 36px;
    }
    .wb-modal-title .mt-ticker {
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 0.04em;
    }
    .wb-modal-subtitle {
      font-size: 12px;
      color: #8888a0;
    }
    .wb-modal-close {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      color: #555568;
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .wb-modal-close:hover { color: #e55; }
    .wb-modal-body {
      padding: 8px 24px 16px;
      overflow-y: auto;
      flex: 1;
    }
    .wb-modal-sector { margin-bottom: 4px; }
    .wb-modal-sector-header {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 14px 0 8px;
      border-top: 1px solid rgba(168, 85, 247, 0.15);
      margin-bottom: 4px;
    }
    .wb-modal-sector:first-child .wb-modal-sector-header {
      border-top: none;
      padding-top: 8px;
    }
    .wb-modal-source { margin-bottom: 8px; }
    .wb-modal-source-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }
    .wb-modal-source-ticker {
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .wb-modal-source-sep { color: #3a3a50; font-size: 11px; }
    .wb-modal-source-company {
      font-size: 12px;
      color: #9ca3af;
    }
    .wb-modal-rationale {
      display: none;
      font-size: 11px;
      color: #6b7280;
      font-style: italic;
      line-height: 1.65;
      margin-top: 3px;
      padding-left: 10px;
      border-left: 2px solid rgba(168, 85, 247, 0.2);
    }
    .wb-modal-rationale.wb-rat-on { display: block; }
    .wb-modal-footer {
      padding: 10px 24px 16px;
      border-top: 1px solid rgba(168, 85, 247, 0.12);
      text-align: center;
      flex-shrink: 0;
    }
    .wb-rationale-btn {
      background: none;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 6px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 18px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .wb-rationale-btn:hover { background: rgba(168, 85, 247, 0.1); }

    /* ── "Read full sitrep" link in modal rationale ── */
    .sr-read-link {
      font-size: 10px;
      color: #a78bfa;
      text-decoration: none;
      margin-left: 7px;
      white-space: nowrap;
      cursor: pointer;
    }
    .sr-read-link:hover { text-decoration: underline; }

    /* ── Sitrep research panel ───────────────────── */
    #sr-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 1199;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #sr-backdrop.sr-open { opacity: 1; pointer-events: auto; }
    #sr-panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: min(50vw, 720px);
      background: #e5e7eb;
      border-left: 1px solid rgba(0,0,0,0.12);
      z-index: 1200;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: -4px 0 24px rgba(0,0,0,0.15);
    }
    #sr-panel.sr-open { transform: translateX(0); }
    #sr-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      flex-shrink: 0;
      background: #d1d5db;
    }
    #sr-header-left { flex: 1; min-width: 0; }
    #sr-ticker-line {
      font-weight: 800;
      font-size: 18px;
      color: #111827;
      line-height: 1.2;
      margin-bottom: 6px;
    }
    .sr-ticker-company { font-weight: 400; font-size: 14px; color: #4b5563; margin-left: 8px; }
    #sr-pills { display: flex; flex-wrap: wrap; gap: 4px; }
    .sr-pill {
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 4px; white-space: nowrap;
    }
    .sr-pill-lens   { background: #8b5cf6; color: #fff; font-weight: 700; }
    .sr-pill-lens2  { background: rgba(139,92,246,0.55); color: #fff; }
    .sr-pill-cat    { background: #fbbf24; color: #000; }
    .sr-pill-subcat { background: #06b6d4; color: #fff; font-size: 10px; }
    #sr-updated { font-size: 11px; color: #6b7280; margin-top: 5px; }
    #sr-header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    #sr-full-link {
      font-size: 12px; color: #7c3aed; text-decoration: none; font-weight: 600;
      padding: 4px 8px; border: 1px solid rgba(124,58,237,0.4); border-radius: 4px;
      white-space: nowrap;
    }
    #sr-full-link:hover { border-color: #7c3aed; text-decoration: underline; }
    #sr-close {
      background: none; border: none; color: #374151;
      cursor: pointer; font-size: 17px; padding: 3px 5px; line-height: 1; border-radius: 4px;
    }
    #sr-close:hover { color: #dc2626; }
    #sr-body { flex: 1; overflow-y: auto; padding: 4px 20px 24px; }
    #sr-loading { color: #6b7280; font-size: 14px; padding: 32px 0; text-align: center; }
    #sr-error   { color: #dc2626; font-size: 13px; padding: 20px 0; }
    .sr-section-title {
      font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #8b5cf6;
      margin-bottom: 8px; margin-top: 20px;
      border-bottom: 1px solid rgba(139,92,246,0.3); padding-bottom: 4px;
    }
    .sr-what-they-do { margin: 0; color: #111827; font-size: 13px; line-height: 1.65; }
    .sr-list { margin: 0; padding: 0 0 0 18px; list-style: disc; }
    .sr-list li { color: #111827; font-size: 13px; line-height: 1.55; margin-bottom: 6px; }
    .sr-winners-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-top: 2px; }
    .sr-winner-card {
      background: rgba(0,0,0,0.04); border: 1px solid rgba(139,92,246,0.3);
      border-radius: 6px; padding: 10px 12px;
    }
    .sr-winner-ticker {
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px; font-weight: 700; color: #7c3aed; letter-spacing: 0.04em;
    }
    .sr-winner-rationale { font-size: 11px; color: #1f2937; margin-top: 4px; line-height: 1.5; }
    .sr-toggle-btn {
      background: #8b5cf6; color: #fff; border: none; border-radius: 6px;
      padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
      display: block; margin: 24px auto 4px; transition: background 0.15s;
    }
    .sr-toggle-btn:hover { background: #7c3aed; }

    /* ── Search bar ──────────────────────────────── */
    .search-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      flex: 1;
      min-width: 220px;
      max-width: 400px;
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--accent); }
    .result-count {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Pill filter section ─────────────────────── */
    .pill-section {
      padding: 10px 28px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pill-row {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .pill-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
      white-space: nowrap;
      margin-right: 2px;
      padding-top: 5px; /* align with pill text */
      flex-shrink: 0;
    }

    .pill-group {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    /* Matches scanner .filter-toggle-btn exactly */
    .pill-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      padding: 3px 8px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: all 0.1s;
      line-height: 1.4;
    }
    .pill-btn:hover {
      border-color: var(--muted);
      color: var(--text);
    }
    .pill-btn.active {
      background: var(--pill-active-bg);
      border-color: var(--pill-active-border);
      color: var(--pill-active-text);
    }

    /* Matches scanner .filter-count exactly */
    .pill-count {
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      min-width: 18px;
      text-align: center;
      line-height: 1.4;
    }
    .pill-btn.active .pill-count {
      background: rgba(0,0,0,0.15);
    }

    /* ── Category pill collapse animation ───────── */
    /* Direct "All" pill needs a right margin when gap is 0 */
    #cat-pill-all { margin-right: 4px; }

    /* Container uses margin instead of gap so 0-width wrappers leave no ghost space */
    #cat-pills { gap: 0; }

    /* Wrapper around each non-All category pill */
    .cat-pill-wrap {
      display: inline-flex;
      overflow: hidden;
      max-width: 350px;
      margin-right: 4px;
      transition: max-width 0.18s ease, opacity 0.18s ease, margin-right 0.18s ease;
    }
    .cat-pill-wrap.collapsed {
      max-width: 0;
      opacity: 0;
      pointer-events: none;
      margin-right: 0;
    }

    /* ── Subcategory pills — smaller + teal accent ── */
    .pill-btn.sub-pill {
      padding: 2px 7px;
      font-size: 11px;
    }
    .pill-btn.sub-pill.active {
      background: var(--subpill-active-bg);
      border-color: var(--subpill-active-border);
      color: var(--subpill-active-text);
    }
    .pill-btn.sub-pill .pill-count {
      font-size: 9px;
      padding: 0 4px;
      min-width: 14px;
    }
    /* Subcategory label — slightly smaller to match the sub-pills */
    .pill-label.sub-label {
      font-size: 9px;
      padding-top: 4px;
    }

    /* ── Lens dropdown ───────────────────────────── */
    .lens-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .lens-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      padding: 3px 8px;
      cursor: pointer;
      outline: none;
      min-width: 240px;
      transition: border-color 0.15s;
    }
    .lens-select:focus, .lens-select:hover { border-color: var(--muted); }
    .lens-badge {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      background: #2e1065;
      border: 1px solid var(--accent);
      border-radius: 10px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
    }
    .lens-badge:hover { background: var(--accent-dk); color: #fff; }

    /* ── Table ───────────────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      padding: 0 28px 40px;
      margin-top: 4px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }
    thead tr { border-bottom: 2px solid var(--border); }
    th {
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      white-space: nowrap;
      user-select: none;
      cursor: pointer;
      transition: color 0.15s;
    }
    th.th-nodot { cursor: default; }
    th:not(.th-nodot):hover { color: var(--text); }
    th .sort-icon {
      display: inline-block;
      margin-left: 4px;
      opacity: 0.35;
      font-size: 10px;
    }
    th.sorted .sort-icon { opacity: 1; color: var(--accent); }
    th.sorted { color: var(--accent); }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      cursor: pointer;
    }
    tbody tr:hover { background: var(--row-hover); }
    td { padding: 10px 14px; font-size: 13px; }

    .td-num     { color: var(--muted); font-size: 12px; width: 40px; }
    .td-dot     { width: 48px; text-align: center; }
    .td-ticker  {
      font-weight: 700;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      color: var(--accent);
      letter-spacing: 0.02em;
      width: 80px;
    }
    .td-company  { color: var(--text); }
    .td-category { color: var(--text); }
    .td-subcat   { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .td-price    { color: var(--text); font-family: "Courier New", Courier, monospace; white-space: nowrap; }
    .td-at-add   { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .td-date     { display: block; font-size: 10px; color: var(--muted); opacity: 0.7; margin-top: 1px; }
    .td-chg.pos  { color: var(--green); font-weight: 600; }
    .td-chg.neg  { color: var(--red);   font-weight: 600; }
    .td-chg.neu  { color: var(--muted); }

    /* Research dot */
    .rdot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      vertical-align: middle;
    }
    .rdot-green  { background: var(--green);  box-shadow: 0 0 4px rgba(34,197,94,0.5); }
    .rdot-yellow { background: var(--yellow); box-shadow: 0 0 4px rgba(251,191,36,0.5); }
    .rdot-gray   { background: #6b7280; }

    /* Source badges */
    .source-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .source-badge.combined   { background: #1e3a5f; color: #60a5fa; border: 1px solid #3b82f6; }
    .source-badge.complete   { background: #14532d; color: #4ade80; border: 1px solid #22c55e; }
    .source-badge.supplement { background: #4a1d96; color: #c084fc; border: 1px solid #a855f7; }

    /* ── State / error ───────────────────────────── */
    .state-row td {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      font-size: 14px;
    }
    .error-banner {
      margin: 20px 28px;
      padding: 14px 18px;
      background: #3b0000;
      border: 1px solid #ef4444;
      border-radius: 8px;
      color: #fca5a5;
      font-size: 13px;
      display: none;
    }
    .error-banner.visible { display: block; }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="page-header-left">
      <a class="back-btn" href="/">← Back to Scanner</a>
      <h1 class="page-title">AI Buildout Universe</h1>
      <span class="ticker-count-badge" id="badge">192 Tickers</span>
    </div>
  </div>

  <!-- ── Convergence Winners Banner ───────────────── -->
  <div id="winner-banner">
    <div class="wb-header">
      <span class="wb-title">Convergence Winners</span>
      <span class="wb-meta" id="wb-meta"></span>
    </div>
    <div class="wb-section-label">Top 5 Overall</div>
    <div class="wb-row" id="wb-top5"></div>
    <div class="wb-expansion" id="wb-expansion-top5"></div>
    <div class="wb-section-label">Named Across 5+ Sectors</div>
    <div class="wb-row" id="wb-cross"></div>
    <div class="wb-expansion" id="wb-expansion-cross"></div>
  </div>

  <!-- ── Winner detail modal ───────────────────────── -->
  <div id="wb-modal-overlay">
    <div id="wb-modal">
      <div class="wb-modal-header">
        <div class="wb-modal-title" id="wb-modal-title"></div>
        <div class="wb-modal-subtitle" id="wb-modal-subtitle"></div>
        <button class="wb-modal-close" id="wb-modal-close" title="Close">✕</button>
      </div>
      <div class="wb-modal-body" id="wb-modal-body"></div>
      <div class="wb-modal-footer">
        <button class="wb-rationale-btn" id="wb-rationale-btn">Show rationale ▾</button>
      </div>
    </div>
  </div>

  <!-- ── Sitrep research panel ─────────────────────── -->
  <div id="sr-backdrop"></div>
  <div id="sr-panel">
    <div id="sr-header">
      <div id="sr-header-left">
        <div id="sr-ticker-line"></div>
        <div id="sr-pills"></div>
        <div id="sr-updated"></div>
      </div>
      <div id="sr-header-right">
        <a id="sr-full-link" href="#" target="_blank" rel="noreferrer">Full page ↗</a>
        <button id="sr-close" title="Close">✕</button>
      </div>
    </div>
    <div id="sr-body">
      <div id="sr-loading">Loading…</div>
      <div id="sr-content" style="display:none"></div>
      <div id="sr-error" style="display:none"></div>
    </div>
  </div>

  <!-- ── Search bar ────────────────────────────────── -->
  <div class="search-bar">
    <input id="search" class="search-input" type="text"
      placeholder="Filter by ticker or company…" autocomplete="off" spellcheck="false" />
    <span class="result-count" id="result-count"></span>
  </div>

  <!-- ── Pill filters ──────────────────────────────── -->
  <div class="pill-section">
    <!-- Lens row: dropdown shortcut for pre-defined ticker sets -->
    <div class="pill-row">
      <span class="pill-label">Lens</span>
      <div class="lens-controls">
        <select id="lens-select" class="lens-select">
          <option value="">None (use category / subcategory filters)</option>
        </select>
        <span id="lens-badge" class="lens-badge"></span>
      </div>
    </div>
    <!-- Category row: always visible -->
    <div class="pill-row">
      <span class="pill-label">Category</span>
      <div class="pill-group" id="cat-pills"></div>
    </div>
    <!-- Subcategory row: shown only when a category is active -->
    <div class="pill-row" id="subcat-row" style="display:none">
      <span class="pill-label sub-label">Subcategory</span>
      <div class="pill-group" id="subcat-pills"></div>
    </div>
  </div>

  <div class="error-banner" id="error-banner"></div>

  <div class="table-wrap">
    <table id="ticker-table">
      <thead>
        <tr>
          <th class="td-num th-nodot">#</th>
          <th class="td-dot th-nodot">Research</th>
          <th data-col="ticker" class="sorted">Ticker <span class="sort-icon">↑</span></th>
          <th data-col="company_name">Company <span class="sort-icon">↕</span></th>
          <th data-col="source">Source <span class="sort-icon">↕</span></th>
          <th data-col="category">Category <span class="sort-icon">↕</span></th>
          <th data-col="current_price">Price <span class="sort-icon">↕</span></th>
          <th data-col="price_at_add">At Add <span class="sort-icon">↕</span></th>
          <th data-col="change_pct">Change % <span class="sort-icon">↕</span></th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr class="state-row"><td colspan="9">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // ── Shared HTML-escape utility ────────────────────────────────────────────
    function esc(str) {
      return String(str || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // ── Sitrep research panel (vanilla JS) ───────────────────────────────────
    (function initSitrepPanel() {
      const state = { compact: true, data: null };

      function srClose() {
        document.getElementById("sr-backdrop").classList.remove("sr-open");
        document.getElementById("sr-panel").classList.remove("sr-open");
        document.body.style.overflow = "";
      }

      function srOpen(ticker) {
        const loading = document.getElementById("sr-loading");
        const content = document.getElementById("sr-content");
        const errEl   = document.getElementById("sr-error");

        state.compact = true;
        state.data    = null;

        loading.style.display = "";
        content.style.display = "none";
        content.innerHTML     = "";
        errEl.style.display   = "none";

        document.getElementById("sr-ticker-line").innerHTML =
          `<span style="font-weight:800;color:#111827">${esc(ticker)}</span>`;
        document.getElementById("sr-pills").innerHTML   = "";
        document.getElementById("sr-updated").textContent = "";
        document.getElementById("sr-full-link").href   = `/ai-overview/${encodeURIComponent(ticker)}`;

        document.getElementById("sr-backdrop").classList.add("sr-open");
        document.getElementById("sr-panel").classList.add("sr-open");
        document.body.style.overflow = "hidden";

        fetch(`/api/sitrep/${encodeURIComponent(ticker)}`)
          .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
          .then(d => {
            state.data = d;
            srRenderHeader(d);
            loading.style.display = "none";
            srRenderContent();
            content.style.display = "";
          })
          .catch(e => {
            loading.style.display = "none";
            errEl.textContent     = `Error: ${e.message}`;
            errEl.style.display   = "";
          });
      }

      function srRenderHeader(d) {
        document.getElementById("sr-ticker-line").innerHTML =
          `<span style="font-weight:800;color:#111827">${esc(d.ticker || "")}</span>` +
          (d.company_name ? `<span class="sr-ticker-company">${esc(d.company_name)}</span>` : "");

        let ph = "";
        if (d.primary_lens) ph += `<span class="sr-pill sr-pill-lens">${esc(d.primary_lens)}</span>`;
        (d.lenses || []).filter(l => l !== d.primary_lens).forEach(l => {
          ph += `<span class="sr-pill sr-pill-lens2">${esc(l)}</span>`;
        });
        if (d.category)    ph += `<span class="sr-pill sr-pill-cat">${esc(d.category)}</span>`;
        if (d.subcategory) ph += `<span class="sr-pill sr-pill-subcat">${esc(d.subcategory)}</span>`;
        document.getElementById("sr-pills").innerHTML = ph;
        document.getElementById("sr-updated").textContent =
          d.last_updated ? `Updated ${d.last_updated}` : "";
      }

      function srListHtml(items) {
        let h = `<ul class="sr-list">`;
        for (const item of items) {
          if (typeof item === "string") {
            h += `<li>${esc(item)}</li>`;
          } else {
            const title = item.label || item.title || item.name || item.component || "";
            const body  = item.text  || item.body  || item.detail || item.description || "";
            h += `<li>`;
            if (title) h += `<strong>${esc(title)}${body ? " — " : ""}</strong>`;
            if (body)  h += esc(body);
            h += `</li>`;
          }
        }
        return h + `</ul>`;
      }

      function srWinnersHtml(winners) {
        let h = `<div class="sr-winners-grid">`;
        for (const w of winners) {
          const t = w.ticker || String(w);
          const r = w.rationale || w.text || "";
          h += `<div class="sr-winner-card">`;
          h += `<div class="sr-winner-ticker">${esc(t)}</div>`;
          if (r) h += `<div class="sr-winner-rationale">${esc(r)}</div>`;
          h += `</div>`;
        }
        return h + `</div>`;
      }

      function srRenderContent() {
        const d = state.data;
        if (!d) return;
        let h = "";
        if (d.what_they_do) {
          h += `<div class="sr-section-title">What They Do</div>`;
          h += `<p class="sr-what-they-do">${esc(d.what_they_do)}</p>`;
        }
        if (!state.compact) {
          if (d.hidden_angles  && d.hidden_angles.length) {
            h += `<div class="sr-section-title">AI Exposure &amp; Hidden Angles</div>`;
            h += srListHtml(d.hidden_angles);
          }
          if (d.kill_components && d.kill_components.length) {
            h += `<div class="sr-section-title">What Could Kill This</div>`;
            h += srListHtml(d.kill_components);
          }
          if (d.winners && d.winners.length) {
            h += `<div class="sr-section-title">Who Wins If This Fails</div>`;
            h += srWinnersHtml(d.winners);
          }
        }
        h += `<button class="sr-toggle-btn" onclick="window._srToggle()">`;
        h += state.compact ? "Show full research ▾" : "Show compact view ▴";
        h += `</button>`;
        document.getElementById("sr-content").innerHTML = h;
      }

      // Expose toggle via window so inline onclick can reach it
      window._srToggle = function() {
        state.compact = !state.compact;
        srRenderContent();
      };

      // Expose srOpen globally so the banner IIFE can call it
      window.srOpen = srOpen;

      // Close handlers
      document.getElementById("sr-close")
        .addEventListener("click", srClose);
      document.getElementById("sr-backdrop")
        .addEventListener("click", srClose);

      // Escape: close panel only when the convergence modal is not open
      document.addEventListener("keydown", e => {
        if (e.key !== "Escape") return;
        if (document.getElementById("wb-modal-overlay").classList.contains("wb-open")) return;
        if (document.getElementById("sr-panel").classList.contains("sr-open")) srClose();
      });
    })();

    // ── Convergence Winners Banner (Layers 1-3) ──────────────────────────────
    (async function loadWinnerBanner() {

      // ── DOM refs ──────────────────────────────────────────────────────────
      const banner       = document.getElementById("winner-banner");
      const top5El       = document.getElementById("wb-top5");
      const crossEl      = document.getElementById("wb-cross");
      const metaEl       = document.getElementById("wb-meta");
      const expTop5      = document.getElementById("wb-expansion-top5");
      const expCross     = document.getElementById("wb-expansion-cross");
      const modalOverlay = document.getElementById("wb-modal-overlay");
      const modalTitleEl = document.getElementById("wb-modal-title");
      const modalSubEl   = document.getElementById("wb-modal-subtitle");
      const modalBody    = document.getElementById("wb-modal-body");
      const modalClose   = document.getElementById("wb-modal-close");
      const rationaleBtn = document.getElementById("wb-rationale-btn");

      // ── State ─────────────────────────────────────────────────────────────
      let winnerLookup  = {};      // ticker → full winner obj from all_winners_with_sources
      let activeChipEl  = null;    // currently highlighted chip element
      let activeExpEl   = null;    // currently shown expansion div
      let rationaleOn   = false;   // whether rationale text is shown in modal

      // ── Utilities ─────────────────────────────────────────────────────────
      function esc(str) {
        return String(str || "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      function stripCatPrefix(s) {
        // "10. Cooling & Thermal" → "Cooling & Thermal"
        return (s || "").replace(/^\d+\.\s*/, "");
      }

      // Group sources by their lens (or stripped category as fallback)
      function groupBySector(sources) {
        const map = new Map();
        for (const s of (sources || [])) {
          const key = s.source_lens || stripCatPrefix(s.source_category) || "Other";
          if (!map.has(key)) map.set(key, []);
          map.get(key).push(s);
        }
        return map; // Map<sectorName, sources[]>
      }

      // Sector name → count pairs, sorted by count desc
      function sectorCounts(sources) {
        const m = new Map();
        for (const s of (sources || [])) {
          const k = s.source_lens || stripCatPrefix(s.source_category) || "Other";
          m.set(k, (m.get(k) || 0) + 1);
        }
        return [...m.entries()].sort((a, b) => b[1] - a[1]);
      }

      // ── Layer 1: Inline expansion ─────────────────────────────────────────

      function collapseExpansion() {
        if (activeChipEl) activeChipEl.classList.remove("wb-chip-active");
        if (activeExpEl)  { activeExpEl.innerHTML = ""; activeExpEl.style.display = "none"; }
        activeChipEl = null;
        activeExpEl  = null;
      }

      function showExpansion(winner, chipEl, expEl) {
        // Deactivate a different chip in the OTHER row's expansion
        if (activeChipEl && activeChipEl !== chipEl) {
          activeChipEl.classList.remove("wb-chip-active");
        }
        if (activeExpEl && activeExpEl !== expEl) {
          activeExpEl.innerHTML = "";
          activeExpEl.style.display = "none";
        }

        // Toggle: same chip clicked again → collapse
        if (activeChipEl === chipEl) {
          collapseExpansion();
          return;
        }

        activeChipEl = chipEl;
        activeExpEl  = expEl;
        chipEl.classList.add("wb-chip-active");

        const inUniverse = winner.in_universe;
        const counts     = sectorCounts(winner.sources);
        const total      = (winner.sources || []).length;

        // Meta lines (lens / category / subcategory / universe flag)
        let metaHtml = "";
        if (inUniverse) {
          if (winner.primary_lens)
            metaHtml += `<div><strong>Lens:</strong> ${esc(winner.primary_lens)} <span style="color:#444458">(primary)</span></div>`;
          if (winner.category)
            metaHtml += `<div><strong>Category:</strong> ${esc(winner.category)}</div>`;
          if (winner.subcategory)
            metaHtml += `<div><strong>Subcategory:</strong> ${esc(winner.subcategory)}</div>`;
          metaHtml += `<div><strong>Sitrep:</strong> <span class="wb-in-universe">✓ In universe</span></div>`;
        } else {
          metaHtml += `<div><strong>Sitrep:</strong> <span class="wb-not-universe">Not in universe</span></div>`;
        }

        // Sector pills
        const pillsHtml = counts.map(([name, cnt]) =>
          `<span class="wb-sector-pill">${esc(name)}<span class="sp-count">(${cnt})</span></span>`
        ).join("");

        expEl.innerHTML = `
          <div class="wb-exp-header">
            <div>
              <span class="wb-exp-title">${esc(winner.ticker)}</span>
              ${winner.company_name
                ? `<span class="wb-exp-company">— ${esc(winner.company_name)}</span>`
                : ""}
            </div>
            <button class="wb-exp-close" title="Close">✕</button>
          </div>
          <div class="wb-exp-meta">${metaHtml}</div>
          <div class="wb-exp-sectors-label">
            Named in ${counts.length} sector${counts.length !== 1 ? "s" : ""}
            — ${total} source${total !== 1 ? "s" : ""}
          </div>
          <div class="wb-sector-pills">${pillsHtml}</div>
          <div class="wb-exp-footer">
            <button class="wb-expand-btn">Expand details →</button>
          </div>
        `;
        expEl.style.display = "block";

        expEl.querySelector(".wb-exp-close")
             .addEventListener("click", collapseExpansion);
        expEl.querySelector(".wb-expand-btn")
             .addEventListener("click", () => openModal(winner));
      }

      // ── Layer 2: Modal ────────────────────────────────────────────────────

      function openModal(winner) {
        // Reset rationale state
        rationaleOn = false;
        rationaleBtn.textContent = "Show rationale ▾";

        const grouped = groupBySector(winner.sources);
        const total   = (winner.sources || []).length;
        const sectors = grouped.size;

        // Header
        modalTitleEl.innerHTML =
          `<span class="mt-ticker">${esc(winner.ticker)}</span>` +
          (winner.company_name
            ? ` <span style="font-size:14px;font-weight:400;color:#8888a0">— ${esc(winner.company_name)}</span>`
            : "");
        modalSubEl.textContent =
          `Named ${total} time${total !== 1 ? "s" : ""} across ${sectors} sector${sectors !== 1 ? "s" : ""}`;

        // Body: one .wb-modal-sector per lens group
        let bodyHtml = "";
        let first = true;
        grouped.forEach((sources, sectorName) => {
          bodyHtml += `<div class="wb-modal-sector">`;
          bodyHtml += `<div class="wb-modal-sector-header">`
                    + `── ${esc(sectorName)} (${sources.length} source${sources.length !== 1 ? "s" : ""}) ──`
                    + `</div>`;
          for (const s of sources) {
            bodyHtml += `<div class="wb-modal-source">`;
            bodyHtml += `<div class="wb-modal-source-row">`
                      + `<span class="wb-modal-source-ticker">${esc(s.source_ticker)}</span>`
                      + `<span class="wb-modal-source-sep">—</span>`
                      + `<span class="wb-modal-source-company">${esc(s.source_company || "")}</span>`
                      + `</div>`;
            if (s.rationale) {
              bodyHtml += `<div class="wb-modal-rationale">"${esc(s.rationale)}"`;
              bodyHtml += ` <a class="sr-read-link" href="#" data-source-ticker="${esc(s.source_ticker)}">Read full sitrep →</a>`;
              bodyHtml += `</div>`;
            }
            bodyHtml += `</div>`;  // .wb-modal-source
          }
          bodyHtml += `</div>`;    // .wb-modal-sector
          first = false;
        });

        modalBody.innerHTML = bodyHtml;
        modalOverlay.classList.add("wb-open");
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        modalOverlay.classList.remove("wb-open");
        document.body.style.overflow = "";
      }

      // ── Layer 3: Rationale toggle ─────────────────────────────────────────

      rationaleBtn.addEventListener("click", () => {
        rationaleOn = !rationaleOn;
        rationaleBtn.textContent = rationaleOn ? "Hide rationale ▴" : "Show rationale ▾";
        modalBody.querySelectorAll(".wb-modal-rationale").forEach(el =>
          el.classList.toggle("wb-rat-on", rationaleOn)
        );
      });

      // ── Modal close handlers ──────────────────────────────────────────────

      modalClose.addEventListener("click", closeModal);
      modalOverlay.addEventListener("click", e => {
        if (e.target === modalOverlay) closeModal();
      });
      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && modalOverlay.classList.contains("wb-open")) closeModal();
      });

      // ── "Read full sitrep" delegated handler ─────────────────────────────
      // Fires on any .sr-read-link click inside the modal body.
      // Closes the convergence modal and opens the research panel for that source.
      modalBody.addEventListener("click", e => {
        const link = e.target.closest(".sr-read-link");
        if (!link) return;
        e.preventDefault();
        const ticker = link.dataset.sourceTicker;
        if (ticker && window.srOpen) {
          closeModal();
          window.srOpen(ticker);
        }
      });

      // ── Build chip ────────────────────────────────────────────────────────

      function buildChip(winner, subLabel, expEl) {
        const el = document.createElement("div");
        el.className = "wb-chip";
        el.title = `${winner.ticker}${winner.company_name ? " — " + winner.company_name : ""} · click for details`;
        el.innerHTML =
          `<span class="wb-chip-ticker">${esc(winner.ticker)}</span>` +
          (winner.company_name
            ? `<span class="wb-divider"></span><span class="wb-chip-company">${esc(winner.company_name)}</span>`
            : "") +
          `<span class="wb-divider"></span><span class="wb-chip-count">${winner.mentions}×</span>` +
          `<span class="wb-chip-sectors">${subLabel}</span>`;

        el.addEventListener("click", () => {
          // Always use the full enriched object from the lookup
          const full = winnerLookup[winner.ticker] || winner;
          showExpansion(full, el, expEl);
        });
        return el;
      }

      // ── Fetch and render ──────────────────────────────────────────────────

      try {
        const res = await fetch("/api/winner-frequency");
        if (!res.ok) throw new Error("not found");
        const d = await res.json();

        winnerLookup = d.all_winners_with_sources || {};

        metaEl.textContent =
          `${d.total_sitreps_analyzed} sitreps · ${d.total_unique_winners} unique winners`;

        (d.top_5_overall || []).forEach((w, i) => {
          top5El.appendChild(buildChip(w, `#${i + 1}`, expTop5));
        });

        (d.cross_cutting_winners || []).forEach(w => {
          crossEl.appendChild(buildChip(w, `${w.sectors_count} sectors`, expCross));
        });

        banner.style.display = "block";

      } catch (err) {
        banner.style.display = "block";
        top5El.innerHTML = `<span class="wb-error">Winner frequency data not available — run scripts/analyze_winners.py to generate.</span>`;
      }

    })();

    // ── State ────────────────────────────────────────────────────────────────
    let allTickers    = [];
    let sortCol       = "ticker";
    let sortDir       = 1;
    let filterText    = "";
    let activeCats    = new Set();   // multi-select categories
    let activeSubcats = new Set();   // multi-select subcategories
    let lensData      = [];          // [{id, name, group, tickers:[...]}]
    let lensTickers   = null;        // Set of tickers for active lens (null = no lens)
    let activeLensId  = "";

    let TOTAL = 0;  // set from actual API response (non-defense tickers only)

    // ── Load data (tickers + lenses in parallel) ─────────────────────────────
    async function loadTickers() {
      try {
        const [tickerRes, lensRes] = await Promise.all([
          fetch("/api/ai-overview/tickers"),
          fetch("/api/ai-overview/lenses"),
        ]);
        if (!tickerRes.ok) throw new Error("HTTP " + tickerRes.status);
        const tickerData = await tickerRes.json();
        allTickers = tickerData.tickers || tickerData;
        TOTAL = allTickers.length;

        if (lensRes.ok) {
          const lensJson = await lensRes.json();
          lensData = lensJson.lenses || [];
          buildLensDropdown();
        }

        buildCategoryPills();
        render();
      } catch (err) {
        const banner = document.getElementById("error-banner");
        banner.textContent = "Failed to load tickers: " + err.message;
        banner.classList.add("visible");
        document.getElementById("table-body").innerHTML =
          '<tr class="state-row"><td colspan="9">Error loading data.</td></tr>';
      }
    }

    // ── Category / subcategory counts ────────────────────────────────────────
    function catCounts() {
      const m = {};
      allTickers.forEach(t => {
        const c = t.category || "";
        if (c) m[c] = (m[c] || 0) + 1;
      });
      return m;
    }

    // Union of subcategory counts across all currently active categories
    function subcatCountsForActive() {
      const m = {};
      allTickers
        .filter(t => activeCats.has(t.category))
        .forEach(t => {
          const s = t.subcategory || "";
          if (s) m[s] = (m[s] || 0) + 1;
        });
      return m;
    }

    // ── Lens dropdown ─────────────────────────────────────────────────────────
    function buildLensDropdown() {
      const sel = document.getElementById("lens-select");
      if (!sel || lensData.length === 0) return;

      const groupOrder = [
        "Front-end (Chip Production)",
        "Back-end (Packaging + Chips)",
        "Infrastructure",
        "Demand & Adjacent",
      ];
      const grouped = {};
      lensData.forEach(l => {
        const g = l.group || "Other";
        if (!grouped[g]) grouped[g] = [];
        grouped[g].push(l);
      });

      groupOrder.forEach(grp => {
        if (!grouped[grp] || grouped[grp].length === 0) return;
        const og = document.createElement("optgroup");
        og.label = grp;
        grouped[grp].forEach(l => {
          const opt = document.createElement("option");
          opt.value = l.id;
          opt.textContent = l.name + "  (" + l.tickers.length + ")";
          og.appendChild(opt);
        });
        sel.appendChild(og);
      });

      sel.addEventListener("change", () => {
        const val = sel.value;
        if (!val) { clearLens(); return; }
        const lens = lensData.find(l => l.id === val);
        if (lens) activateLens(lens);
      });
    }

    function activateLens(lens) {
      activeLensId = lens.id;
      lensTickers  = new Set(lens.tickers);
      const badge  = document.getElementById("lens-badge");
      badge.textContent = "✕  " + lens.name;
      badge.style.display = "inline-flex";
      render();
    }

    function clearLens() {
      activeLensId = "";
      lensTickers  = null;
      document.getElementById("lens-select").value = "";
      const badge = document.getElementById("lens-badge");
      badge.style.display = "none";
      render();
    }

    document.getElementById("lens-badge").addEventListener("click", clearLens);

    // ── Build category pills (once after data loads) ─────────────────────────
    function buildCategoryPills() {
      const counts = catCounts();
      const cats = Object.keys(counts).sort((a, b) => {
        const na = parseInt(a) || 999;
        const nb = parseInt(b) || 999;
        return na - nb;
      });

      const container = document.getElementById("cat-pills");
      container.innerHTML = "";

      // "All" pill — always visible, clears all selections
      const allBtn = makePill("All", allTickers.length, true, () => {
        activeCats.clear();
        activeSubcats.clear();
        refreshCatPills();
        refreshSubcatRow();
        render();
      });
      allBtn.id = "cat-pill-all";
      container.appendChild(allBtn);

      cats.forEach(cat => {
        const btn = makePill(cat, counts[cat], false, () => {
          // Multi-select toggle
          if (activeCats.has(cat)) {
            activeCats.delete(cat);
            cleanOrphanedSubcats();
          } else {
            activeCats.add(cat);
          }
          refreshCatPills();
          refreshSubcatRow();
          render();
        });
        btn.dataset.cat = cat;

        // Wrap in collapsible wrapper for animate-out on filter
        const wrap = document.createElement("span");
        wrap.className = "cat-pill-wrap";
        wrap.dataset.cat = cat;
        wrap.appendChild(btn);
        container.appendChild(wrap);
      });
    }

    // Remove subcats that no longer belong to any active category
    function cleanOrphanedSubcats() {
      if (activeCats.size === 0) { activeSubcats.clear(); return; }
      const validSubcats = new Set(
        allTickers
          .filter(t => activeCats.has(t.category))
          .map(t => t.subcategory)
          .filter(Boolean)
      );
      activeSubcats.forEach(s => { if (!validSubcats.has(s)) activeSubcats.delete(s); });
    }

    function refreshCatPills() {
      const allBtn = document.getElementById("cat-pill-all");
      if (allBtn) allBtn.classList.toggle("active", activeCats.size === 0);

      document.querySelectorAll("#cat-pills .cat-pill-wrap").forEach(wrap => {
        const cat     = wrap.dataset.cat;
        const isActive = activeCats.has(cat);
        const btn     = wrap.querySelector(".pill-btn");
        if (btn) btn.classList.toggle("active", isActive);

        // Collapse non-active pills when any category is selected
        if (activeCats.size === 0) {
          wrap.classList.remove("collapsed");
        } else {
          wrap.classList.toggle("collapsed", !isActive);
        }
      });
    }

    // ── Subcategory pill row ──────────────────────────────────────────────────
    function refreshSubcatRow() {
      const row = document.getElementById("subcat-row");
      if (activeCats.size === 0) {
        row.style.display = "none";
        return;
      }
      row.style.display = "";

      const counts  = subcatCountsForActive();
      const subcats = Object.keys(counts).sort();
      const container = document.getElementById("subcat-pills");
      container.innerHTML = "";

      // Count of tickers across all active categories (for "All" pill)
      const totalInCats = allTickers.filter(t => activeCats.has(t.category)).length;

      const allBtn = makePill("All", totalInCats, activeSubcats.size === 0, () => {
        activeSubcats.clear();
        refreshSubcatPills();
        render();
      }, true);
      allBtn.id = "subcat-pill-all";
      container.appendChild(allBtn);

      subcats.forEach(sub => {
        const btn = makePill(sub, counts[sub], activeSubcats.has(sub), () => {
          if (activeSubcats.has(sub)) {
            activeSubcats.delete(sub);
          } else {
            activeSubcats.add(sub);
          }
          refreshSubcatPills();
          render();
        }, true);
        btn.dataset.sub = sub;
        container.appendChild(btn);
      });
    }

    function refreshSubcatPills() {
      document.querySelectorAll("#subcat-pills .pill-btn").forEach(btn => {
        const isAll   = btn.id === "subcat-pill-all";
        const active  = isAll ? activeSubcats.size === 0 : activeSubcats.has(btn.dataset.sub);
        btn.classList.toggle("active", active);
      });
    }

    // ── Pill factory ─────────────────────────────────────────────────────────
    function makePill(label, count, isActive, onClick, isSubcat) {
      const btn = document.createElement("button");
      let cls = "pill-btn";
      if (isSubcat) cls += " sub-pill";
      if (isActive) cls += " active";
      btn.className = cls;
      btn.innerHTML =
        escHtml(label) +
        '<span class="pill-count">' + count + '</span>';
      btn.addEventListener("click", onClick);
      return btn;
    }

    // ── Filter + sort ─────────────────────────────────────────────────────────
    function sortedFiltered() {
      let rows = allTickers.map((t, i) => Object.assign({}, t, { _idx: i + 1 }));

      // Text search
      if (filterText) {
        const q = filterText.toLowerCase();
        rows = rows.filter(r =>
          r.ticker.toLowerCase().includes(q) ||
          (r.company_name || "").toLowerCase().includes(q)
        );
      }

      // Lens filter (independent — intersects with pills if both active)
      if (lensTickers) {
        rows = rows.filter(r => lensTickers.has(r.ticker));
      }

      // Category filter (union across active set)
      if (activeCats.size > 0) {
        rows = rows.filter(r => activeCats.has(r.category));
      }

      // Subcategory filter (further refines category results)
      if (activeSubcats.size > 0) {
        rows = rows.filter(r => activeSubcats.has(r.subcategory));
      }

      rows.sort((a, b) => {
        const av = a[sortCol] != null ? a[sortCol] : null;
        const bv = b[sortCol] != null ? b[sortCol] : null;
        // Nulls always sort to the bottom regardless of direction
        if (av === null && bv === null) return 0;
        if (av === null) return 1;
        if (bv === null) return -1;
        if (typeof av === "number" && typeof bv === "number") return sortDir * (av - bv);
        return sortDir * String(av).localeCompare(String(bv), undefined, { numeric: true });
      });
      return rows;
    }

    // ── Render ───────────────────────────────────────────────────────────────
    function render() {
      const rows  = sortedFiltered();
      const tbody = document.getElementById("table-body");

      const filtered = filterText || activeCats.size > 0 || activeSubcats.size > 0 || lensTickers;
      document.getElementById("badge").textContent =
        filtered ? rows.length + " of " + TOTAL + " Tickers" : TOTAL + " Tickers";
      document.getElementById("result-count").textContent =
        rows.length + (filtered ? " of " + TOTAL : "") + " tickers";

      if (rows.length === 0) {
        tbody.innerHTML = '<tr class="state-row"><td colspan="9">No tickers match your filter.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map((r, i) =>
        '<tr onclick="navigateToDetail(\'' + escHtml(r.ticker) + '\')">' +
          '<td class="td-num">' + (i + 1) + '</td>' +
          '<td class="td-dot">' + researchDot(r.sections_parsed) + '</td>' +
          '<td class="td-ticker">' + escHtml(r.ticker) + '</td>' +
          '<td class="td-company">' + escHtml(r.company_name || "") + '</td>' +
          '<td>' + sourceBadge(r.source) + '</td>' +
          '<td class="td-category">' + fmtCategory(r.category, r.subcategory) + '</td>' +
          '<td class="td-price">' + fmtPrice(r.current_price) + '</td>' +
          '<td class="td-at-add">' + fmtAtAdd(r.price_at_add, r.price_at_add_date) + '</td>' +
          '<td>' + fmtChangePct(r.change_pct) + '</td>' +
        '</tr>'
      ).join("");
    }

    // ── Formatters ───────────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function sourceBadge(source) {
      if (source === "Combined v2")
        return '<span class="source-badge combined">Combined v2</span>';
      if (source === "COMPLETE")
        return '<span class="source-badge complete">COMPLETE</span>';
      if (source === "Final Supplement")
        return '<span class="source-badge supplement">Final Supplement</span>';
      return '<span class="source-badge">' + escHtml(source || "") + '</span>';
    }

    function researchDot(sections_parsed) {
      if (sections_parsed == null)
        return '<span class="rdot rdot-gray" title="Sitrep not yet available"></span>';
      if (sections_parsed === 7)
        return '<span class="rdot rdot-green" title="7/7 sections"></span>';
      return '<span class="rdot rdot-yellow" title="' + sections_parsed + '/7 sections"></span>';
    }

    function fmtPrice(v) {
      if (v == null) return '<span style="color:var(--muted)">—</span>';
      return "$" + Number(v).toFixed(2);
    }

    function fmtAtAdd(price, date) {
      if (price == null) return '<span style="color:var(--muted)">—</span>';
      let dateStr = "";
      if (date) {
        const parts = date.split("-");
        const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        dateStr = '<span class="td-date">' +
          d.toLocaleDateString("en-US", { month: "short", day: "numeric" }) +
          '</span>';
      }
      return "$" + Number(price).toFixed(2) + dateStr;
    }

    function fmtChangePct(v) {
      if (v == null) return '<span class="td-chg neu">—</span>';
      const cls = v > 0 ? "pos" : v < 0 ? "neg" : "neu";
      const sign = v > 0 ? "+" : "";
      return '<span class="td-chg ' + cls + '">' + sign + Number(v).toFixed(1) + '%</span>';
    }

    function fmtCategory(cat, sub) {
      if (!cat) return '<span style="color:var(--muted)">—</span>';
      let html = escHtml(cat);
      if (sub) html += '<span class="td-subcat">' + escHtml(sub) + '</span>';
      return html;
    }

    // ── Column sort ──────────────────────────────────────────────────────────
    document.querySelectorAll("th[data-col]").forEach(th => {
      th.addEventListener("click", () => {
        const col = th.dataset.col;
        if (sortCol === col) { sortDir = -sortDir; }
        else { sortCol = col; sortDir = 1; }
        document.querySelectorAll("th[data-col]").forEach(h => {
          h.classList.remove("sorted");
          h.querySelector(".sort-icon").textContent = "↕";
        });
        th.classList.add("sorted");
        th.querySelector(".sort-icon").textContent = sortDir === 1 ? "↑" : "↓";
        render();
      });
    });

    // ── Search ───────────────────────────────────────────────────────────────
    document.getElementById("search").addEventListener("input", e => {
      filterText = e.target.value.trim();
      render();
    });

    // ── Smart back navigation ────────────────────────────────────────────────
    // Store the current URL so the sitrep detail page can route back here.
    function navigateToDetail(ticker) {
      sessionStorage.setItem("sitrep_return_to", window.location.href);
      window.location.href = "/ai-overview/" + ticker;
    }

    loadTickers();
  </script>
</body>
</html>
