<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casino Scanner — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 36px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo-icon {
      font-size: 2rem;
      display: block;
      margin-bottom: 8px;
    }

    .logo h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #e6edf3;
      letter-spacing: -0.02em;
    }

    .logo p {
      font-size: 0.8rem;
      color: #7d8590;
      margin-top: 4px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .error-banner {
      background: rgba(248, 81, 73, 0.12);
      border: 1px solid rgba(248, 81, 73, 0.4);
      border-radius: 6px;
      color: #f85149;
      font-size: 0.85rem;
      padding: 10px 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: #8b949e;
      margin-bottom: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.95rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #388bfd;
      box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.15);
    }

    input::placeholder {
      color: #484f58;
    }

    button[type="submit"] {
      width: 100%;
      background: #238636;
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 8px;
      padding: 11px;
      transition: background 0.15s, box-shadow 0.15s;
    }

    button[type="submit"]:hover {
      background: #2ea043;
      box-shadow: 0 0 0 3px rgba(46, 160, 67, 0.2);
    }

    button[type="submit"]:active {
      background: #1a7f37;
    }

    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: #484f58;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">🎰</span>
      <h1>Casino Scanner</h1>
      <p>Options Intelligence</p>
    </div>

    <!-- Error banner — shown when ?error=1 is in the URL -->
    <div class="error-banner" id="errorBanner" style="display:none">
      Invalid username or password.
    </div>

    <form method="post" action="/login">
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="username"
          autocomplete="username"
          autofocus
          required
        />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>
      <button type="submit">Sign in</button>
    </form>

    <div class="footer">Casino Scanner · Private access only</div>
  </div>

  <script>
    // Show error banner if ?error=1 is in the URL
    if (new URLSearchParams(window.location.search).get('error') === '1') {
      document.getElementById('errorBanner').style.display = 'block';
    }
  </script>
</body>
</html>
